<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a;display:grid;grid-template-columns:240px 1fr}
aside{background:#fff;border-right:1px solid #e2e8f0;padding:24px 16px}

main{padding:32px;display:grid;gap:20px;align-content:start}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.c{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0}
.c h4{font-size:13px;color:#64748b}.c p{font-size:30px;font-weight:700;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:#64748b;font-size:12px;padding:8px;border-bottom:1px solid #e2e8f0}
td{padding:12px 8px;border-bottom:1px solid #f1f5f9}.r{text-align:right}
.btn{justify-self:end;background:#10b981;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600}
